[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-forge"
version = "0.1.0"
description = "AgentForge — 自生长的多智能体编排系统。通过 RAG 自动匹配/创建 Agent 和工作流，越用越聪明。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai>=2.20,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.24,<1",
    "rich>=14,<15",
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
agent-forge = "agent_forge.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
